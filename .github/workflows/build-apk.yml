name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install API 35 platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare output
        run: cp app/build/outputs/apk/debug/app-debug.apk ELYAS_LIGHT_CONTROL_v1.2_LED.apk
      - name: Download APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: ELYAS_LIGHT_CONTROL_ANDROID_APK
          path: ELYAS_LIGHT_CONTROL_v1.2_LED.apk
          if-no-files-found: error
